<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario</title>
  </head>

  <body>
    <div class="container">
      <h2>Formulário</h2>
      <form method="GET" id="formAluno">
        <label for="name">Nome:</label>
        <input id="nome" name="nome" required />
        <label for="nota1">Nota 1º Bim:</label>
        <input
          id="nota1"
          name="nota1"
          type="number"
          min="0"
          max="10"
          step="0.1"
          required
        /><br /><br />
        <label for="nota2">Nota 2º Bim:</label>
        <input
          id="nota2"
          name="nota2"
          type="number"
          min="0"
          max="10"
          step="0.1"
          required
        /><br /><br />
        <button id="submitBtn" type="submit">Salvar</button>
      </form>
      <div id="resumoAluno"></div>

      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Nota 1</th>
            <th>Nota 2</th>
            <th>Média</th>
            <th>Situação</th>
          </tr>
        </thead>
        <tbody id="tabelaAlunos"></tbody>
      </table>

      <script src="./script.js" defer></script>
      <link rel="stylesheet" href="./style.css" />
    </div>
  </body>
</html>
